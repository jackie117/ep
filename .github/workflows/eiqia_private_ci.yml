name: eiqia_private_ci

on:
    repository_dispatch:
        types:
            - eiqia_private_push
    workflow_dispatch:
        inputs:
            private_ref:
                description: "eiqia branch, tag, or SHA"
                required: true
                default: "main"
                type: string

permissions:
    contents: read

concurrency:
    group: eiqia-private-ci-${{ github.event.client_payload.private_ref_name || inputs.private_ref }}
    cancel-in-progress: true

jobs:
    main_site_quality:
        name: main_site_quality
        runs-on: ubuntu-latest
        services:
            mysql:
                image: mysql:8.0
                env:
                    MYSQL_ROOT_PASSWORD: "123456"
                    MYSQL_DATABASE: eiqia
                    MYSQL_CHARACTER_SET_SERVER: utf8mb4
                    MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping -h localhost -p123456"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=10

        env:
            NX_DAEMON: "false"
            NX_ISOLATE_PLUGINS: "false"
            PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

        steps:
            - name: resolve_private_ref
              id: private_ref
              shell: bash
              run: |
                  if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
                      echo "value=${{ github.event.client_payload.private_sha }}" >> "$GITHUB_OUTPUT"
                  else
                      echo "value=${{ inputs.private_ref }}" >> "$GITHUB_OUTPUT"
                  fi

            - name: checkout_private_eiqia
              uses: actions/checkout@v5
              with:
                  repository: jackie117/eiqia
                  ref: ${{ steps.private_ref.outputs.value }}
                  ssh-key: ${{ secrets.EIQIA_DEPLOY_KEY }}
                  path: eiqia
                  persist-credentials: false
                  fetch-depth: 1

            - name: setup_node
              uses: actions/setup-node@v6
              with:
                  node-version: 20
                  cache: pnpm
                  cache-dependency-path: eiqia/frontend/my-workspace/pnpm-lock.yaml

            - name: setup_dotnet
              uses: actions/setup-dotnet@v5
              with:
                  dotnet-version: 9.0.x

            - name: setup_pnpm
              run: |
                  corepack enable
                  corepack prepare pnpm@10 --activate
                  pnpm --version

            - name: install_frontend_dependencies
              run: pnpm --dir=eiqia/frontend/my-workspace install --frozen-lockfile

            - name: run_frontend_quick_quality
              working-directory: eiqia/frontend/my-workspace
              timeout-minutes: 30
              run: pnpm quality:main-site:quick

            - name: run_backend_quality
              working-directory: eiqia
              shell: pwsh
              timeout-minutes: 35
              run: ./scripts/ci/run_main_site_backend_quality.ps1 -Profile production
